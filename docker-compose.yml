services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: caeca
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no ambiente}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no ambiente}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no ambiente}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER no ambiente}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no ambiente}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    image: caca-backend:local
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente}
      BREVO_API_KEY: ${BREVO_API_KEY:?Defina BREVO_API_KEY no ambiente}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/caeca?createDatabaseIfNotExist=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Defina MYSQL_USER no ambiente}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no ambiente}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER no ambiente}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no ambiente}
      APP_STORAGE_TYPE: s3
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-bucket-fotos-caeca}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/swagger-ui/index.html || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  mysql_data:
