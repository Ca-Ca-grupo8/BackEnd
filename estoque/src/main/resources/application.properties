spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.datasource.url=jdbc:mysql://localhost:3306/caeca?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true

# O Flyway e executado por config/BootstrapFlyway depois do ddl-auto=update.
# A autoconfiguracao do Spring Boot roda antes do Hibernate e marcaria a
# migration como aplicada sem ter criado o schema ainda.
spring.flyway.enabled=false

spring.sql.init.mode=always

jwt.validity=${JWT_VALIDITY:1800}

jwt.secret=${JWT_SECRET}

app.storage.type=${APP_STORAGE_TYPE:s3}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:bucket-fotos-caeca}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}

logging.level.org.springframework.web=DEBUG

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB

brevo.api.key = ${BREVO_API_KEY}