# Tempo de validade do token em SEGUNDOS
# 3600 = 1 hora | 86400 = 24 horas | 604800 = 7 dias
# Em produ√ß√£o: tokens de curta dura√ß√£o (15-60 min) + refresh token s√£o mais seguros
jwt.validity=${JWT_VALIDITY:86400}

# Chave secreta para assinar os tokens (algoritmo HMAC-SHA256)
# REQUISITOS:
#   - Deve estar codificada em Base64
#   - M√≠nimo de 32 bytes ap√≥s decodifica√ß√£o (256 bits para HS256)
# ATEN√á√ÉO:
#   - NUNCA use esta chave em produ√ß√£o
#   - Em produ√ß√£o, defina a vari√°vel de ambiente JWT_SECRET com uma chave forte
#   - Nunca commite chaves reais no reposit√≥rio Git
jwt.secret=${JWT_SECRET:}

app.storage.type=${APP_STORAGE_TYPE:s3}
