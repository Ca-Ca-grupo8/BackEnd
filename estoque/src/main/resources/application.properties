spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.datasource.url=jdbc:mysql://localhost:3306/caeca?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false

spring.sql.init.mode=always

jwt.validity=${JWT_VALIDITY:1800}

jwt.secret=${JWT_SECRET}

app.storage.type=${APP_STORAGE_TYPE:s3}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:bucket-fotos-caeca}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}

logging.level.org.springframework.web=DEBUG

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB

brevo.api.key = ${BREVO_API_KEY}

app.maleta.cron=${APP_MALETA_CRON:* * * * * *}
app.rotinas.cron=${APP_ROTINAS_CRON:0 0 8 * * *}
app.estoque.mensal.cron=${APP_ESTOQUE_MENSAL_CRON:0 0 9 1 * *}

app.convite.expiracao-horas=${APP_CONVITE_EXPIRACAO_HORAS:24}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=3000ms
spring.rabbitmq.listener.simple.retry.multiplier=2