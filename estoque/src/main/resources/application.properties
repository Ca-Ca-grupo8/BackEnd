    spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.datasource.url=jdbc:mysql://localhost:3306/caeca?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}   
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

jwt.validity=${JWT_VALIDITY:86400}

jwt.secret=${JWT_SECRET}

app.storage.type=${APP_STORAGE_TYPE}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET}
app.storage.s3.region=${APP_STORAGE_S3_REGION}

logging.level.org.springframework.web=DEBUG

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB