spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.datasource.url=jdbc:mysql://localhost:3306/caeca?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configura��es do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# Mant�m a execu��o do data.sql se voc� ainda precisar popular o banco
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
# =============================================================================
# CONFIGURAÇÕES JWT
# =============================================================================

# Tempo de validade do token em SEGUNDOS
# 3600 = 1 hora | 86400 = 24 horas | 604800 = 7 dias
# Em produção: tokens de curta duração (15-60 min) + refresh token são mais seguros
jwt.validity=${JWT_VALIDITY:86400}

# Chave secreta para assinar os tokens (algoritmo HMAC-SHA256)
# REQUISITOS:
#   - Deve estar codificada em Base64
#   - Mínimo de 32 bytes após decodificação (256 bits para HS256)
# ATENÇÃO:
#   - NUNCA use esta chave em produção
#   - Em produção, defina a variável de ambiente JWT_SECRET com uma chave forte
#   - Nunca commite chaves reais no repositório Git
jwt.secret=${JWT_SECRET:}
